<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏓 Турниры по настольному теннису</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { margin:0; font-family:system-ui; background:#0f172a; color:white; }
.container { max-width:700px; margin:auto; padding:15px; text-align:center; }
h1,h2 { margin-bottom:10px; }
input,button { width:100%; padding:10px; border-radius:8px; border:none; margin-top:8px; font-size:16px; }
button { background:#38bdf8; font-weight:bold; cursor:pointer; transition: transform 0.2s; }
button:hover { transform: scale(1.05); }

.calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:20px; }
.day { padding:10px; border-radius:8px; cursor:pointer; transition:0.2s; position:relative; }
.day.selected { background:#22c55e; color:black; }
.day.tournament { background:#facc15; color:black; }

.success { color:#22c55e; font-weight:bold; margin-top:10px; }
.error { color:#f87171; font-weight:bold; margin-top:10px; }
</style>
</head>
<body>
<div class="container">
<h1>🏓 Турниры по настольному теннису</h1>

<div>
<input id="login" placeholder="Логин (латиница/цифры)">
<input id="password" type="password" placeholder="Пароль">
<button onclick="auth()">Войти / Регистрация</button>
<div id="message"></div>
</div>

<h2>Выберите даты</h2>
<div id="calendar" class="calendar"></div>
<button onclick="submitDates()">Подтвердить даты</button>
</div>

<script>
const SUPABASE_URL = 'https://bqycjfcjtdawyrysgrbw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxeWNqZmNqdGRhd3lyeXNncmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY2MDE5NzAsImV4cCI6MjA4MjE3Nzk3MH0.LEOUMFAd1cz_1e4uawJcaZLPCMqAQHEWM52Oy7fDjsE';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginInput = document.getElementById('login');
const passwordInput = document.getElementById('password');
const messageDiv = document.getElementById('message');
const calendarDiv = document.getElementById('calendar');

let user = null;
let selectedDates = [];

// --- Авторизация / регистрация ---
async function auth(){
  const loginVal = loginInput.value.trim();
  const passVal = passwordInput.value.trim();
  messageDiv.innerText = '';
  messageDiv.className = '';

  if(!loginVal || !passVal){ 
    messageDiv.innerText = 'Введите логин и пароль';
    messageDiv.className = 'error';
    return;
  }

  // Только ASCII для логина и пароля
  if(!/^[\x20-\x7E]+$/.test(loginVal) || !/^[\x20-\x7E]+$/.test(passVal)){
    messageDiv.innerText = 'Логин и пароль должны быть только латиница/цифры';
    messageDiv.className = 'error';
    return;
  }

  try {
    const {data, error} = await supabaseClient.from('pp_users')
      .select('*')
      .eq('login', loginVal);
    if(error) throw error;

    let foundUser = data.find(u => u.password === passVal);
    if(!foundUser){
      // Регистрация нового пользователя
      const {data: newUser, error: insertError} = await supabaseClient
        .from('pp_users').insert({login: loginVal,password: passVal}).select().single();
      if(insertError) throw insertError;
      foundUser = newUser;
      messageDiv.innerText = 'Регистрация выполнена!';
      messageDiv.className = 'success';
    } else {
      messageDiv.innerText = 'Вход выполнен!';
      messageDiv.className = 'success';
    }

    user = foundUser;
    buildCalendar();
    loadTournaments();

  } catch(e){
    console.error(e);
    messageDiv.innerText = 'Ошибка: '+e.message;
    messageDiv.className = 'error';
  }
}

// --- Календарь ---
function buildCalendar(){
  calendarDiv.innerHTML = '';
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  for(let i=0;i<firstDay;i++){ calendarDiv.appendChild(document.createElement('div')); }

  for(let d=1; d<=daysInMonth; d++){
    const day = document.createElement('div');
    day.className = 'day';
    day.innerText = d;
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    day.dataset.date = dateStr;
    day.onclick = ()=>{
      if(selectedDates.includes(dateStr)){
        selectedDates = selectedDates.filter(x=>x!==dateStr);
        day.classList.remove('selected');
      } else {
        selectedDates.push(dateStr);
        day.classList.add('selected');
      }
    }
    calendarDiv.appendChild(day);
  }
}

// --- Подтверждение выбранных дат ---
async function submitDates(){
  if(!user) return alert('Сначала войдите!');

  try{
    for(const date of selectedDates){
      await supabaseClient.from('pp_user_dates').insert({
        user_id: user.id,
        selected_date: date
      });
    }
    messageDiv.innerText = 'Даты отправлены!';
    messageDiv.className = 'success';
    await checkTournaments();
    loadTournaments();
  } catch(e){
    console.error(e);
    messageDiv.innerText = 'Ошибка отправки дат: '+e.message;
    messageDiv.className = 'error';
  }
}

// --- Авто-турниры ---
async function checkTournaments(){
  const {data: allDates} = await supabaseClient.from('pp_user_dates').select('*');
  const dateCount = {};
  allDates.forEach(d=>{ dateCount[d.selected_date] = (dateCount[d.selected_date]||0)+1; });

  for(const [date, count] of Object.entries(dateCount)){
    if(count>=3){
      // Проверяем, существует ли турнир
      const {data: existing} = await supabaseClient.from('pp_tournaments')
        .select('*').eq('play_date', date);
      if(existing.length===0){
        // Отправляем дату в формате YYYY-MM-DD
        await supabaseClient.from('pp_tournaments').insert({
          play_date: date,
          name: `Турнир ${date}`
        });
      }
    }
  }
}

// --- Загрузка турниров ---
async function loadTournaments(){
  const {data: tournaments} = await supabaseClient.from('pp_tournaments').select('*');
  const days = calendarDiv.querySelectorAll('.day');
  days.forEach(day=>day.classList.remove('tournament'));

  tournaments.forEach(t=>{
    const dayDiv = calendarDiv.querySelector(`[data-date="${t.play_date}"]`);
    if(dayDiv) dayDiv.classList.add('tournament');
  });
}
</script>
</body>
</html>
