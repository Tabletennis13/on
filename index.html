<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>TT Турниры</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:sans-serif;background:#020617;color:#fff}
.box{max-width:420px;margin:auto;padding:15px}
h2{text-align:center}
input,button{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:0}
button{background:#2563eb;color:#fff}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{padding:10px;border-radius:8px;text-align:center;font-size:14px}
.free{background:#1e293b}
.pick{background:#2563eb}
.tour{background:#16a34a}
.legend div{font-size:13px;margin-top:4px}
.admin{background:#0f172a;padding:10px;border-radius:10px;margin-top:15px}
</style>
</head>
<body>

<div class="box" id="auth">
<h2>🏓 Вход</h2>
<input id="login" placeholder="Логин">
<input id="pass" placeholder="Пароль" type="password">
<button onclick="login()">Войти / Регистрация</button>
</div>

<div class="box" id="app" style="display:none">
<h2>📅 Календарь</h2>
<div class="calendar" id="cal"></div>

<div class="legend">
<div>🔵 Выбрано игроками</div>
<div>🟢 Турнир</div>
</div>

<button onclick="save()">Записаться</button>

<div class="admin" id="admin" style="display:none">
<h3>⚙ Админ панель</h3>
<input id="tname" placeholder="Название турнира">
<input id="tdate" type="date">
<button onclick="addTournament()">Создать турнир</button>
</div>
</div>

<script>
const sb = supabaseJs.createClient(
"https://bqycjfcjtdawyrysgrbw.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxeWNqZmNqdGRhd3lyeXNncmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY2MDE5NzAsImV4cCI6MjA4MjE3Nzk3MH0.LEOUMFAd1cz_1e4uawJcaZLPCMqAQHEWM52Oy7fDjsE"
)

let user=null, picks=[]
const cal=document.getElementById("cal")
const month=new Date()
month.setDate(1)

async function login(){
const l=login.value,p=pass.value
let {data}=await sb.from("tt_users").select("*").eq("login",l).single()
if(!data){
await sb.from("tt_users").insert({login:l,password:p})
data=(await sb.from("tt_users").select("*").eq("login",l).single()).data
}
if(data.password!==p)return alert("Неверный пароль")
user=data
auth.style.display="none"
app.style.display="block"
if(user.is_admin)admin.style.display="block"
load()
}

async function load(){
cal.innerHTML=""
const {data:sign}=await sb.from("tt_signups").select("*")
const {data:tour}=await sb.from("tt_tournaments").select("*")
for(let i=1;i<=31;i++){
const d=new Date(month.getFullYear(),month.getMonth(),i)
if(d.getMonth()!=month.getMonth())continue
const ds=d.toISOString().slice(0,10)
const el=document.createElement("div")
el.textContent=i
el.className="day free"
if(sign.find(x=>x.play_date===ds))el.className="day pick"
if(tour.find(x=>x.play_date===ds))el.className="day tour"
el.onclick=()=>{
if(el.classList.contains("tour"))return
el.classList.toggle("pick")
picks.includes(ds)?picks=picks.filter(x=>x!==ds):picks.push(ds)
}
cal.appendChild(el)
}
}

async function save(){
for(let d of picks){
await sb.from("tt_signups").insert({user_id:user.id,play_date:d})
const {count}=await sb.from("tt_signups").select("*",{count:"exact",head:true}).eq("play_date",d)
if(count>=3){
await sb.from("tt_tournaments").insert({title:"Авто турнир",play_date:d})
}
}
location.reload()
}

async function addTournament(){
await sb.from("tt_tournaments")
.insert({title:tname.value,play_date:tdate.value,auto_created:false})
load()
}
</script>

</body>
</html>
