<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Турниры по настольному теннису</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .user-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }

        .auth-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"], input[type="password"] {
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #667eea;
            outline: none;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .main-content {
            display: flex;
            flex-direction: column;
            padding: 30px;
            gap: 30px;
        }

        @media (min-width: 768px) {
            .main-content {
                flex-direction: row;
            }
        }

        .calendar-section {
            flex: 1;
            min-width: 0;
        }

        .info-section {
            flex: 0 0 300px;
        }

        #calendar {
            width: 100%;
            overflow-x: auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 20px;
        }

        .calendar-container {
            overflow-x: auto;
            max-width: 100%;
            min-height: 400px;
        }

        .flatpickr-calendar {
            margin: 0 auto;
        }

        .legend {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: white;
            border-radius: 10px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .selected-date {
            background: #4CAF50 !important;
            color: white !important;
        }

        .tournament-date {
            background: #FF9800 !important;
            color: white !important;
        }

        .popular-date {
            background: #2196F3 !important;
            color: white !important;
        }

        .admin-panel {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
            display: none;
        }

        .admin-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        .date-info {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .selected-dates-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .date-chip {
            background: #e3f2fd;
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remove-date {
            cursor: pointer;
            color: #f44336;
            font-weight: bold;
        }

        .tournaments-list {
            margin-top: 20px;
        }

        .tournament-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-planned {
            background: #4CAF50;
            color: white;
        }

        .status-active {
            background: #2196F3;
            color: white;
        }

        .status-completed {
            background: #9E9E9E;
            color: white;
        }

        @media (max-width: 768px) {
            .container {
                border-radius: 10px;
                margin: 10px;
            }
            
            .user-section {
                flex-direction: column;
                gap: 15px;
            }
            
            .auth-form {
                flex-direction: column;
                width: 100%;
            }
            
            input[type="text"], input[type="password"] {
                width: 100%;
            }
            
            button {
                width: 100%;
            }
            
            #calendar {
                padding: 10px;
            }
            
            .legend {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏓 Календарь теннисных турниров</h1>
            <p>Выбирайте даты для игры и участвуйте в турнирах!</p>
        </header>

        <div class="user-section">
            <div class="user-info">
                <span id="username">Гость</span>
            </div>
            <div class="auth-form">
                <input type="text" id="login" placeholder="Логин">
                <input type="password" id="password" placeholder="Пароль">
                <button onclick="loginUser()">Войти</button>
                <button onclick="registerUser()" style="background: #4CAF50;">Регистрация</button>
                <button onclick="logoutUser()" style="background: #f44336; display: none;" id="logoutBtn">Выйти</button>
            </div>
        </div>

        <div class="main-content">
            <div class="calendar-section">
                <div class="date-info">
                    <h3>Выбранные даты:</h3>
                    <div class="selected-dates-list" id="selectedDatesList"></div>
                    <button onclick="saveSelectedDates()" style="margin-top: 15px; display: none;" id="saveDatesBtn">Сохранить мои даты</button>
                </div>
                
                <div id="calendar" class="calendar-container">
                    <!-- Календарь будет здесь -->
                </div>
                
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color selected-date"></div>
                        <span>Дата выбрана вами</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color tournament-date"></div>
                        <span>Турнир назначен</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color popular-date"></div>
                        <span>3+ человека выбрали эту дату</span>
                    </div>
                </div>
            </div>
            
            <div class="info-section">
                <div class="admin-panel" id="adminPanel">
                    <h3>Админ-панель</h3>
                    <div class="admin-controls">
                        <input type="text" id="tournamentName" placeholder="Название турнира">
                        <input type="text" id="tournamentDate" placeholder="Дата турнира (YYYY-MM-DD)" class="date-input">
                        <button onclick="createTournament()">Создать турнир</button>
                        <button onclick="deleteTournament()" style="background: #f44336;">Удалить турнир</button>
                    </div>
                </div>
                
                <div class="tournaments-list">
                    <h3>Ближайшие турниры:</h3>
                    <div id="tournamentsList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    
    <script>
        // Инициализация Supabase один раз
        const supabaseClient = window.supabase.createClient(
            'https://bqycjfcjtdawyrysgrbw.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxeWNqZmNqdGRhd3lyeXNncmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY2MDE5NzAsImV4cCI6MjA4MjE3Nzk3MH0.LEOUMFAd1cz_1e4uawJcaZLPCMqAQHEWM52Oy7fDjsE'
        );

        // Переменные состояния
        let currentUser = null;
        let selectedDates = [];
        let tournaments = [];
        let userSelections = [];
        let calendarInstance = null;

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            initCalendar();
            loadData();
        });

        // Проверка авторизации
        async function checkAuth() {
            const userData = localStorage.getItem('pingpong_user');
            if (userData) {
                currentUser = JSON.parse(userData);
                updateUIForUser();
            }
        }

        // Обновление UI для пользователя
        function updateUIForUser() {
            const usernameEl = document.getElementById('username');
            const logoutBtn = document.getElementById('logoutBtn');
            const saveDatesBtn = document.getElementById('saveDatesBtn');
            const adminPanel = document.getElementById('adminPanel');
            
            if (currentUser) {
                usernameEl.textContent = currentUser.username;
                logoutBtn.style.display = 'inline-block';
                saveDatesBtn.style.display = 'inline-block';
                
                if (currentUser.username === 'Admin') {
                    adminPanel.style.display = 'block';
                }
            } else {
                usernameEl.textContent = 'Гость';
                logoutBtn.style.display = 'none';
                saveDatesBtn.style.display = 'none';
                adminPanel.style.display = 'none';
            }
        }

        // Вход в систему
        async function loginUser() {
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            
            if (!login || !password) {
                alert('Введите логин и пароль');
                return;
            }
            
            // Проверка админского аккаунта
            if (login === 'Admin' && password === '13311331') {
                currentUser = { id: 1, username: 'Admin', isAdmin: true };
                localStorage.setItem('pingpong_user', JSON.stringify(currentUser));
                updateUIForUser();
                alert('Добро пожаловать, Admin!');
                loadUserDates();
                return;
            }
            
            // Проверка обычных пользователей
            try {
                const { data: users, error } = await supabaseClient
                    .from('pingpong_users')
                    .select('*')
                    .eq('username', login)
                    .eq('password', password)
                    .single();
                
                if (error) throw error;
                
                if (users) {
                    currentUser = users;
                    localStorage.setItem('pingpong_user', JSON.stringify(currentUser));
                    updateUIForUser();
                    alert('Вход выполнен успешно!');
                    loadUserDates();
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Неверный логин или пароль');
            }
        }

        // Регистрация
        async function registerUser() {
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            
            if (!login || !password) {
                alert('Введите логин и пароль');
                return;
            }
            
            if (password.length < 3) {
                alert('Пароль должен содержать минимум 3 символа');
                return;
            }
            
            try {
                // Проверка существующего пользователя
                const { data: existingUser, error: checkError } = await supabaseClient
                    .from('pingpong_users')
                    .select('*')
                    .eq('username', login)
                    .single();
                
                if (existingUser && !checkError) {
                    alert('Пользователь с таким логином уже существует');
                    return;
                }
                
                // Создание нового пользователя
                const { data, error } = await supabaseClient
                    .from('pingpong_users')
                    .insert([{ 
                        username: login, 
                        password: password 
                    }])
                    .select()
                    .single();
                
                if (error) throw error;
                
                currentUser = data;
                localStorage.setItem('pingpong_user', JSON.stringify(currentUser));
                updateUIForUser();
                alert('Регистрация успешна!');
            } catch (error) {
                console.error('Registration error:', error);
                alert('Ошибка регистрации: ' + error.message);
            }
        }

        // Выход из системы
        function logoutUser() {
            currentUser = null;
            localStorage.removeItem('pingpong_user');
            updateUIForUser();
            selectedDates = [];
            updateSelectedDatesList();
            calendarInstance.clear();
        }

        // Инициализация календаря
        function initCalendar() {
            calendarInstance = flatpickr("#calendar", {
                inline: true,
                mode: "multiple",
                dateFormat: "Y-m-d",
                locale: "ru",
                minDate: "today",
                maxDate: new Date().fp_incr(365),
                onChange: function(selectedDates, dateStr, instance) {
                    if (currentUser) {
                        selectedDates = selectedDates.map(date => date.toISOString().split('T')[0]);
                        updateSelectedDatesList();
                        refreshCalendar();
                    } else {
                        alert('Пожалуйста, войдите в систему чтобы выбирать даты');
                        instance.clear();
                    }
                }
            });
        }

        // Обновление стилей календаря
        function refreshCalendar() {
            if (!calendarInstance) return;
            
            setTimeout(() => {
                const days = document.querySelectorAll('.flatpickr-day');
                days.forEach(day => {
                    const dateStr = day.dateObj.toISOString().split('T')[0];
                    
                    // Сброс стилей
                    day.classList.remove('selected-date', 'tournament-date', 'popular-date');
                    
                    // Проверка выбранных дат текущим пользователем
                    if (selectedDates.includes(dateStr)) {
                        day.classList.add('selected-date');
                    }
                    
                    // Проверка турниров
                    const tournament = tournaments.find(t => t.date === dateStr);
                    if (tournament) {
                        day.classList.add('tournament-date');
                        day.title = `Турнир: ${tournament.name}`;
                    }
                    
                    // Проверка популярных дат
                    const dateSelections = userSelections.filter(s => s.date === dateStr);
                    if (dateSelections.length >= 3) {
                        day.classList.add('popular-date');
                        day.title = `Эту дату выбрали ${dateSelections.length} человек`;
                    }
                });
            }, 100);
        }

        // Обновление списка выбранных дат
        function updateSelectedDatesList() {
            const listEl = document.getElementById('selectedDatesList');
            listEl.innerHTML = '';
            
            selectedDates.forEach(date => {
                const dateChip = document.createElement('div');
                dateChip.className = 'date-chip';
                dateChip.innerHTML = `
                    ${date}
                    <span class="remove-date" onclick="removeDate('${date}')">×</span>
                `;
                listEl.appendChild(dateChip);
            });
            
            refreshCalendar();
        }

        // Удаление даты из выбранных
        function removeDate(date) {
            selectedDates = selectedDates.filter(d => d !== date);
            updateSelectedDatesList();
            
            // Обновляем выбор в календаре
            if (calendarInstance) {
                const newDates = selectedDates.map(d => new Date(d));
                calendarInstance.setDate(newDates, true);
            }
        }

        // Сохранение выбранных дат
        async function saveSelectedDates() {
            if (!currentUser) return;
            
            if (selectedDates.length === 0) {
                alert('Выберите хотя бы одну дату');
                return;
            }
            
            try {
                // Удаляем старые выборы пользователя
                const { error: deleteError } = await supabaseClient
                    .from('pingpong_user_selections')
                    .delete()
                    .eq('user_id', currentUser.id);
                
                if (deleteError) throw deleteError;
                
                // Сохраняем новые выборы
                const selections = selectedDates.map(date => ({
                    user_id: currentUser.id,
                    date: date,
                    username: currentUser.username
                }));
                
                const { error: insertError } = await supabaseClient
                    .from('pingpong_user_selections')
                    .insert(selections);
                
                if (insertError) throw insertError;
                
                alert('Даты сохранены успешно!');
                loadUserSelections();
            } catch (error) {
                console.error('Save error:', error);
                alert('Ошибка сохранения: ' + error.message);
            }
        }

        // Загрузка данных
        async function loadData() {
            await Promise.all([
                loadTournaments(),
                loadUserSelections()
            ]);
        }

        // Загрузка турниров
        async function loadTournaments() {
            try {
                const { data, error } = await supabaseClient
                    .from('pingpong_tournaments')
                    .select('*')
                    .order('date', { ascending: true });
                
                if (error) throw error;
                
                tournaments = data || [];
                updateTournamentsList();
                refreshCalendar();
            } catch (error) {
                console.error('Load tournaments error:', error);
            }
        }

        // Загрузка выборов пользователей
        async function loadUserSelections() {
            try {
                const { data, error } = await supabaseClient
                    .from('pingpong_user_selections')
                    .select('*');
                
                if (error) throw error;
                
                userSelections = data || [];
                checkForAutoTournaments();
                refreshCalendar();
            } catch (error) {
                console.error('Load selections error:', error);
            }
        }

        // Загрузка дат текущего пользователя
        async function loadUserDates() {
            if (!currentUser) return;
            
            try {
                const { data, error } = await supabaseClient
                    .from('pingpong_user_selections')
                    .select('date')
                    .eq('user_id', currentUser.id);
                
                if (error) throw error;
                
                if (data) {
                    selectedDates = data.map(item => item.date);
                    updateSelectedDatesList();
                    
                    // Устанавливаем даты в календарь
                    if (calendarInstance && selectedDates.length > 0) {
                        const dateObjects = selectedDates.map(d => new Date(d));
                        calendarInstance.setDate(dateObjects, true);
                    }
                }
            } catch (error) {
                console.error('Load user dates error:', error);
            }
        }

        // Проверка на автоматическое создание турниров
        async function checkForAutoTournaments() {
            // Группируем выборы по дате
            const dateGroups = {};
            userSelections.forEach(selection => {
                if (!dateGroups[selection.date]) {
                    dateGroups[selection.date] = [];
                }
                if (!dateGroups[selection.date].includes(selection.user_id)) {
                    dateGroups[selection.date].push(selection.user_id);
                }
            });
            
            // Проверяем каждую дату
            for (const [date, userIds] of Object.entries(dateGroups)) {
                if (userIds.length >= 3) {
                    // Проверяем, есть ли уже турнир на эту дату
                    const existingTournament = tournaments.find(t => t.date === date);
                    if (!existingTournament) {
                        // Автоматически создаем турнир
                        await createAutoTournament(date, userIds.length);
                    }
                }
            }
        }

        // Создание автоматического турнира
        async function createAutoTournament(date, participantsCount) {
            try {
                const tournamentName = `Авто-турнир ${date} (${participantsCount} участников)`;
                
                const { error } = await supabaseClient
                    .from('pingpong_tournaments')
                    .insert([{
                        name: tournamentName,
                        date: date,
                        is_auto: true,
                        status: 'planned',
                        created_by: 1
                    }]);
                
                if (error) throw error;
                
                loadTournaments();
                console.log(`Автоматически создан турнир на ${date}!`);
            } catch (error) {
                console.error('Auto tournament creation error:', error);
            }
        }

        // Обновление списка турниров
        function updateTournamentsList() {
            const listEl = document.getElementById('tournamentsList');
            listEl.innerHTML = '';
            
            const today = new Date().toISOString().split('T')[0];
            const upcomingTournaments = tournaments
                .filter(t => t.date >= today)
                .slice(0, 10);
            
            if (upcomingTournaments.length === 0) {
                listEl.innerHTML = '<p>Нет предстоящих турниров</p>';
                return;
            }
            
            upcomingTournaments.forEach(tournament => {
                const tournamentEl = document.createElement('div');
                tournamentEl.className = 'tournament-item';
                tournamentEl.innerHTML = `
                    <div>
                        <strong>${tournament.name}</strong><br>
                        <small>${tournament.date}</small>
                    </div>
                    <div class="status status-${tournament.status}">
                        ${tournament.status === 'planned' ? 'Запланирован' : 
                          tournament.status === 'active' ? 'Активен' : 'Завершен'}
                    </div>
                `;
                listEl.appendChild(tournamentEl);
            });
        }

        // Создание турнира (админ)
        async function createTournament() {
            if (!currentUser || currentUser.username !== 'Admin') {
                alert('Только администратор может создавать турниры');
                return;
            }
            
            const name = document.getElementById('tournamentName').value;
            const date = document.getElementById('tournamentDate').value;
            
            if (!name || !date) {
                alert('Заполните все поля');
                return;
            }
            
            try {
                const { error } = await supabaseClient
                    .from('pingpong_tournaments')
                    .insert([{
                        name: name,
                        date: date,
                        is_auto: false,
                        status: 'planned',
                        created_by: currentUser.id
                    }]);
                
                if (error) throw error;
                
                alert('Турнир создан успешно!');
                document.getElementById('tournamentName').value = '';
                document.getElementById('tournamentDate').value = '';
                loadTournaments();
            } catch (error) {
                console.error('Create tournament error:', error);
                alert('Ошибка создания: ' + error.message);
            }
        }

        // Удаление турнира (админ)
        async function deleteTournament() {
            if (!currentUser || currentUser.username !== 'Admin') {
                alert('Только администратор может удалять турниры');
                return;
            }
            
            const date = document.getElementById('tournamentDate').value;
            
            if (!date) {
                alert('Введите дату турнира для удаления');
                return;
            }
            
            if (!confirm(`Удалить турнир на ${date}?`)) return;
            
            try {
                const { error } = await supabaseClient
                    .from('pingpong_tournaments')
                    .delete()
                    .eq('date', date);
                
                if (error) throw error;
                
                alert('Турнир удален успешно!');
                document.getElementById('tournamentDate').value = '';
                loadTournaments();
            } catch (error) {
                console.error('Delete tournament error:', error);
                alert('Ошибка удаления: ' + error.message);
            }
        }
    </script>
</body>
</html>
