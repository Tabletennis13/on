<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏓 Турниры - Регистрация</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { margin:0; font-family:system-ui; background:#0f172a; color:white; }
.container { max-width:500px; margin:auto; padding:10px; text-align:center; }
h1 { margin-bottom:10px; }
input,button { width:100%; padding:10px; border-radius:8px; border:none; margin-top:8px; font-size:16px; }
button { background:#38bdf8; font-weight:bold; cursor:pointer; transition: transform 0.2s; }
button:hover { transform: scale(1.05); }
.tournament-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-top:20px; }
.tournament-card { background:#22d3ee; color:black; padding:10px; border-radius:10px; position:relative; animation:fadeIn 0.5s ease forwards; cursor:pointer; transition: transform 0.2s; }
.tournament-card:hover { transform: scale(1.05); }
@keyframes fadeIn { from {opacity:0; transform:translateY(-10px);} to {opacity:1; transform:translateY(0);} }
.tooltip { position:absolute; top:-40px; left:50%; transform:translateX(-50%); background:#1e293b; padding:4px 6px; font-size:12px; border-radius:4px; display:none; white-space:nowrap; z-index:10; }
.tournament-card:hover .tooltip { display:block; }
</style>
</head>
<body>
<div class="container">
<h1>🏓 Турниры</h1>
<p>Выберите логин и пароль, чтобы зарегистрироваться или войти</p>

<input id="login" placeholder="Логин">
<input id="password" type="password" placeholder="Пароль">
<button onclick="auth()">Войти / Регистрация</button>

<h2 style="margin-top:30px;">Будущие турниры</h2>
<div class="tournament-list" id="tournamentList"></div>

</div>

<script>
const db = supabase.createClient(
  'https://bqycjfcjtdawyrysgrbw.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6ImJxeWNqZmNqdGRyd3lyeXNncmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY2MDE5NzAsImV4cCI6MjA4MjE3Nzk3MH0.LEOUMFAd1cz_1e4uawJcaZLPCMqAQHEWM52Oy7fDjsE'
)

const loginInput=document.getElementById('login')
const passwordInput=document.getElementById('password')
const tournamentList=document.getElementById('tournamentList')
let user=null

async function auth(){
  const loginVal=loginInput.value
  const passVal=passwordInput.value

  if(!loginVal||!passVal){alert('Введите логин и пароль'); return;}

  let {data} = await db.from('pp_users').select('*')
    .eq('login',loginVal).eq('password',passVal).single()

  if(!data){
    await db.from('pp_users').insert({login:loginVal,password:passVal})
    return auth()
  }

  user=data
  alert('Вход выполнен!'); 
  location.reload() // или редирект на основной календарь
}

async function loadTournaments(){
  const {data: tournaments} = await db.from('pp_tournaments').select('*').order('play_date', {ascending:true})
  tournamentList.innerHTML=''
  for(const t of tournaments){
    const card=document.createElement('div')
    card.className='tournament-card'
    card.innerText=t.play_date+' 🏆'

    // Tooltip с участниками
    const tt=document.createElement('div')
    tt.className='tooltip'
    const res=await db.from('pp_tournament_players').select('user_id').eq('tournament_id',t.id)
    if(res.data.length>0){
      const names=[]
      for(const p of res.data){
        const u=await db.from('pp_users').select('login').eq('id',p.user_id).single()
        names.push(u.data.login)
      }
      tt.innerText='Участники: '+names.join(', ')
      card.appendChild(tt)
    }

    tournamentList.appendChild(card)
  }
}

loadTournaments()
</script>
</body>
</html>
