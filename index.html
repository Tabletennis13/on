<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏓 Турниры по настольному теннису</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { margin:0; font-family:system-ui; background:#0f172a; color:white; }
.container { max-width:700px; margin:auto; padding:15px; text-align:center; }
h1,h2,h3 { margin-bottom:10px; }
input,button,select { width:100%; padding:10px; border-radius:8px; border:none; margin-top:8px; font-size:16px; }
button { background:#38bdf8; font-weight:bold; cursor:pointer; transition: transform 0.2s; }
button:hover { transform: scale(1.05); }

.calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:20px; }
.day { padding:10px; border-radius:8px; cursor:pointer; transition:0.2s; position:relative; }
.day.selected { background:#22c55e; color:black; }
.day.tournament { background:#facc15; color:black; }

.success { color:#22c55e; font-weight:bold; margin-top:10px; }
.error { color:#f87171; font-weight:bold; margin-top:10px; }

.admin-panel { margin-top:20px; border:1px solid #38bdf8; padding:10px; border-radius:8px; }
.tournament-item { background:#1e293b; margin:5px 0; padding:5px 8px; border-radius:5px; display:flex; justify-content:space-between; align-items:center; }
.tournament-item span { flex:1; text-align:left; }
.tournament-item button { width:auto; padding:5px 10px; margin-left:5px; background:#f87171; color:black; }
</style>
</head>
<body>
<div class="container">
<h1>🏓 Турниры по настольному теннису</h1>

<div>
<input id="login" placeholder="Логин (латиница/цифры)">
<input id="password" type="password" placeholder="Пароль">
<button onclick="auth()">Войти / Регистрация</button>
<div id="message"></div>
</div>

<h2>Выберите даты</h2>
<div id="calendar" class="calendar"></div>
<button onclick="submitDates()">Подтвердить даты</button>
<div style="margin-top:10px; font-size:14px;">
<span style="background:#22c55e; color:black; padding:2px 6px; border-radius:4px;">Выбранная дата</span>
<span style="background:#facc15; color:black; padding:2px 6px; border-radius:4px;">Турнир</span>
</div>

<div class="admin-panel" id="adminPanel" style="display:none;">
<h3>Админка: Управление турнирами</h3>
<div>
<input id="adminTournamentName" placeholder="Название турнира">
<input id="adminTournamentDate" type="date">
<button onclick="createTournament()">Создать турнир</button>
</div>
<div id="tournamentList"></div>
</div>
</div>

<script>
const SUPABASE_URL = 'https://bqycjfcjtdawyrysgrbw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxeWNqZmNqdGRhd3lyeXNncmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY2MDE5NzAsImV4cCI6MjA4MjE3Nzk3MH0.LEOUMFAd1cz_1e4uawJcaZLPCMqAQHEWM52Oy7fDjsE';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginInput = document.getElementById('login');
const passwordInput = document.getElementById('password');
const messageDiv = document.getElementById('message');
const calendarDiv = document.getElementById('calendar');
const adminPanelDiv = document.getElementById('adminPanel');
const tournamentListDiv = document.getElementById('tournamentList');

let user = null;
let selectedDates = [];
let session = null;

// --- Авторизация / регистрация ---
async function auth(){
  const loginVal = loginInput.value.trim();
  const passVal = passwordInput.value.trim();
  messageDiv.innerText = '';
  messageDiv.className = '';

  if(!loginVal || !passVal){ 
    messageDiv.innerText = 'Введите логин и пароль';
    messageDiv.className = 'error';
    return;
  }

  if(!/^[a-zA-Z0-9]+$/.test(loginVal) || !/^[a-zA-Z0-9]+$/.test(passVal)){
    messageDiv.innerText = 'Логин и пароль должны быть только латиница/цифры';
    messageDiv.className = 'error';
    return;
  }

  try {
    // Сначала пробуем найти пользователя
    const {data: existingUser, error: findError} = await supabaseClient
      .from('pp_users')
      .select('*')
      .eq('login', loginVal)
      .single();

    if(findError && findError.code !== 'PGRST116') { // PGRST116 = не найдено
      throw findError;
    }

    if(existingUser) {
      // Пользователь существует - проверяем пароль
      if(existingUser.password === passVal) {
        user = existingUser;
        messageDiv.innerText = 'Вход выполнен!';
        messageDiv.className = 'success';
      } else {
        messageDiv.innerText = 'Неверный пароль';
        messageDiv.className = 'error';
        return;
      }
    } else {
      // Регистрируем нового пользователя
      const {data: newUser, error: insertError} = await supabaseClient
        .from('pp_users')
        .insert([{login: loginVal, password: passVal}])
        .select()
        .single();
      
      if(insertError) {
        // Если ошибка из-за дубликата, пытаемся войти
        if(insertError.code === '23505') {
          const {data: retryUser} = await supabaseClient
            .from('pp_users')
            .select('*')
            .eq('login', loginVal)
            .single();
          
          if(retryUser && retryUser.password === passVal) {
            user = retryUser;
            messageDiv.innerText = 'Вход выполнен!';
            messageDiv.className = 'success';
          } else {
            throw new Error('Ошибка входа после попытки регистрации');
          }
        } else {
          throw insertError;
        }
      } else {
        user = newUser;
        messageDiv.innerText = 'Регистрация выполнена!';
        messageDiv.className = 'success';
      }
    }

    buildCalendar();
    await loadTournaments();
    if(user.login.toLowerCase() === 'admin') {
      adminPanelDiv.style.display='block';
    }

  } catch(e){
    console.error('Auth error:', e);
    messageDiv.innerText = 'Ошибка: ' + (e.message || 'Неизвестная ошибка');
    messageDiv.className = 'error';
  }
}

// --- Календарь ---
function buildCalendar(){
  calendarDiv.innerHTML = '';
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  // Пустые ячейки для выравнивания
  for(let i = 0; i < (firstDay === 0 ? 6 : firstDay - 1); i++){
    calendarDiv.appendChild(document.createElement('div'));
  }

  for(let d = 1; d <= daysInMonth; d++){
    const day = document.createElement('div');
    day.className = 'day';
    day.innerText = d;
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    day.dataset.date = dateStr;
    day.onclick = () => {
      if(selectedDates.includes(dateStr)){
        selectedDates = selectedDates.filter(x => x !== dateStr);
        day.classList.remove('selected');
      } else {
        selectedDates.push(dateStr);
        day.classList.add('selected');
      }
    }
    calendarDiv.appendChild(day);
  }
}

// --- Подтверждение выбранных дат ---
async function submitDates(){
  if(!user) {
    alert('Сначала войдите!');
    return;
  }

  if(selectedDates.length === 0) {
    alert('Выберите хотя бы одну дату!');
    return;
  }

  try{
    // Удаляем старые выборы пользователя
    await supabaseClient
      .from('pp_user_dates')
      .delete()
      .eq('user_id', user.id);

    // Добавляем новые выборы
    const dateInserts = selectedDates.map(date => ({
      user_id: user.id,
      selected_date: date
    }));

    const {error} = await supabaseClient
      .from('pp_user_dates')
      .insert(dateInserts);

    if(error) throw error;

    messageDiv.innerText = 'Даты сохранены!';
    messageDiv.className = 'success';
    
    await checkTournaments();
    await loadTournaments();
    
    // Очищаем выбор
    selectedDates = [];
    const selectedDays = calendarDiv.querySelectorAll('.day.selected');
    selectedDays.forEach(day => day.classList.remove('selected'));
    
  } catch(e){
    console.error('Submit dates error:', e);
    messageDiv.innerText = 'Ошибка сохранения дат: ' + (e.message || 'Неизвестная ошибка');
    messageDiv.className = 'error';
  }
}

// --- Авто-турниры ---
async function checkTournaments(){
  try {
    const {data: allDates, error} = await supabaseClient
      .from('pp_user_dates')
      .select('*');
    
    if(error) throw error;

    const dateCount = {};
    allDates.forEach(d => {
      dateCount[d.selected_date] = (dateCount[d.selected_date] || 0) + 1;
    });

    // Получаем существующие турниры
    const {data: existingTournaments} = await supabaseClient
      .from('pp_tournaments')
      .select('play_date');

    const existingDates = existingTournaments.map(t => t.play_date);

    for(const [date, count] of Object.entries(dateCount)){
      if(count >= 3 && !existingDates.includes(date)){
        await supabaseClient
          .from('pp_tournaments')
          .insert([{
            play_date: date,
            name: `Турнир ${date}`
          }]);
      }
    }
  } catch(e) {
    console.error('Check tournaments error:', e);
  }
}

// --- Загрузка турниров ---
async function loadTournaments(){
  try {
    const {data: tournaments, error} = await supabaseClient
      .from('pp_tournaments')
      .select('*')
      .order('play_date', {ascending: true});
    
    if(error) throw error;

    const days = calendarDiv.querySelectorAll('.day');
    days.forEach(day => day.classList.remove('tournament'));

    if(tournaments) {
      tournaments.forEach(t => {
        const dayDiv = calendarDiv.querySelector(`[data-date="${t.play_date}"]`);
        if(dayDiv) {
          dayDiv.classList.add('tournament');
          // Добавляем всплывающую подсказку
          dayDiv.title = t.name;
        }
      });
    }

    renderAdminTournamentList(tournaments || []);
  } catch(e) {
    console.error('Load tournaments error:', e);
  }
}

// --- Админка: создать турнир ---
async function createTournament(){
  const name = document.getElementById('adminTournamentName').value.trim();
  const date = document.getElementById('adminTournamentDate').value;
  
  if(!name || !date) {
    alert('Введите название и дату');
    return;
  }

  try{
    const {error} = await supabaseClient
      .from('pp_tournaments')
      .insert([{
        name: name,
        play_date: date,
        created_at: new Date().toISOString()
      }]);
    
    if(error) throw error;
    
    await loadTournaments();
    document.getElementById('adminTournamentName').value = '';
    document.getElementById('adminTournamentDate').value = '';
    alert('Турнир создан!');
  } catch(e){
    console.error('Create tournament error:', e);
    alert('Ошибка: ' + (e.message || 'Неизвестная ошибка'));
  }
}

// --- Админка: список турниров с редактированием/удалением ---
function renderAdminTournamentList(tournaments){
  tournamentListDiv.innerHTML='';
  
  if(tournaments.length === 0) {
    tournamentListDiv.innerHTML = '<p style="color:#94a3b8">Турниров пока нет</p>';
    return;
  }
  
  tournaments.forEach(t => {
    const div = document.createElement('div');
    div.className='tournament-item';
    
    const span = document.createElement('span');
    span.innerText = `${t.name} (${t.play_date})`;
    
    const editBtn = document.createElement('button'); 
    editBtn.innerText='✏️'; 
    editBtn.onclick = async () => {
      const newName = prompt('Новое название турнира', t.name);
      if(!newName) return;
      
      try {
        await supabaseClient
          .from('pp_tournaments')
          .update({name: newName})
          .eq('id', t.id);
        await loadTournaments();
      } catch(e) {
        console.error('Edit tournament error:', e);
        alert('Ошибка редактирования');
      }
    };
    
    const delBtn = document.createElement('button'); 
    delBtn.innerText='🗑️';
    delBtn.onclick = async () => {
      if(confirm(`Удалить турнир "${t.name}"?`)){
        try {
          await supabaseClient
            .from('pp_tournaments')
            .delete()
            .eq('id', t.id);
          await loadTournaments();
        } catch(e) {
          console.error('Delete tournament error:', e);
          alert('Ошибка удаления');
        }
      }
    };
    
    const participantsBtn = document.createElement('button'); 
    participantsBtn.innerText='👥';
    participantsBtn.onclick = async () => {
      try {
        const {data: users, error} = await supabaseClient
          .from('pp_user_dates')
          .select(`
            user_id,
            pp_users!inner(login)
          `)
          .eq('selected_date', t.play_date);
        
        if(error) throw error;
        
        if(users && users.length > 0) {
          const userList = users.map(u => u.pp_users?.login || `ID: ${u.user_id}`).join('\n');
          alert(`Участники турнира "${t.name}" (${t.play_date}):\n\n${userList}\n\nВсего: ${users.length} человек`);
        } else {
          alert(`На турнир "${t.name}" пока никто не записался`);
        }
      } catch(e) {
        console.error('Get participants error:', e);
        alert('Ошибка загрузки участников');
      }
    };
    
    div.appendChild(span); 
    div.appendChild(editBtn); 
    div.appendChild(delBtn); 
    div.appendChild(participantsBtn);
    tournamentListDiv.appendChild(div);
  });
}

// Инициализация при загрузке
document.addEventListener('DOMContentLoaded', () => {
  buildCalendar();
  // Устанавливаем сегодняшнюю дату в поле админки
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('adminTournamentDate').value = today;
});
</script>
</body>
</html>
