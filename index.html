<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Турниры по настольному теннису</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            min-height: 90vh;
        }

        header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .user-section {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .auth-form {
            display: flex;
            gap: 10px;
        }

        input[type="text"],
        input[type="password"] {
            padding: 8px 15px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            color: white;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: rgba(255,255,255,0.7);
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: white;
            background: rgba(255,255,255,0.2);
        }

        button {
            padding: 8px 20px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #f5576c;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .main-content {
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .calendar-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
        }

        .flatpickr-calendar {
            max-width: 100% !important;
            width: 100% !important;
            margin: 0 auto !important;
        }

        .legend {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            border: 1px solid #dee2e6;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 10px;
        }

        .available {
            background-color: #51cf66;
        }

        .selected {
            background-color: #339af0;
        }

        .tournament {
            background-color: #ff6b6b;
        }

        .admin-panel {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
        }

        .admin-panel h3 {
            color: #495057;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #dee2e6;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #495057;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #339af0;
        }

        .tournament-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .tournament-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tournament-info h4 {
            color: #495057;
            margin-bottom: 5px;
        }

        .tournament-info p {
            color: #868e96;
            font-size: 14px;
        }

        .tournament-actions {
            display: flex;
            gap: 5px;
        }

        .tournament-actions button {
            padding: 5px 10px;
            font-size: 12px;
        }

        .status-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            background: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
        }

        .status-message.show {
            transform: translateY(0);
            opacity: 1;
        }

        .status-message.success {
            border-left: 4px solid #51cf66;
        }

        .status-message.error {
            border-left: 4px solid #ff6b6b;
        }

        .admin-only {
            display: none;
        }

        .admin-only.show {
            display: block;
        }

        .day-with-players {
            position: relative;
        }

        .player-count {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #339af0;
            color: white;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 50%;
            min-width: 18px;
            text-align: center;
        }

        .tournament-day {
            background: #ff6b6b !important;
            color: white !important;
        }

        .tournament-day .player-count {
            background: white;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Турниры по настольному теннису</h1>
            <p>Выбирайте даты и участвуйте в турнирах!</p>
            
            <div class="user-section">
                <div id="loginForm" class="auth-form">
                    <input type="text" id="username" placeholder="Логин">
                    <input type="password" id="password" placeholder="Пароль">
                    <button onclick="login()">Войти</button>
                    <button onclick="register()">Регистрация</button>
                </div>
                <div id="userInfo" style="display: none;">
                    <span id="currentUser"></span>
                    <button onclick="logout()">Выйти</button>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="calendar-container">
                <div id="calendar"></div>
                <div class="legend">
                    <h3>Обозначения:</h3>
                    <div class="legend-item">
                        <div class="legend-color available"></div>
                        <span>Свободные даты для записи</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color selected"></div>
                        <span>Дата выбрана вами</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color tournament"></div>
                        <span>Турнир создан</span>
                    </div>
                    <div class="legend-item">
                        <div class="player-count" style="position:static; display:inline-block; margin-right:10px;">3</div>
                        <span>Количество записавшихся на дату</span>
                    </div>
                </div>
            </div>

            <div class="admin-panel">
                <h3>Панель администратора</h3>
                <div id="adminContent" class="admin-only">
                    <div class="form-group">
                        <label>Дата турнира:</label>
                        <input type="date" id="tournamentDate">
                    </div>
                    <div class="form-group">
                        <label>Название турнира:</label>
                        <input type="text" id="tournamentName" placeholder="Введите название турнира">
                    </div>
                    <div class="form-group">
                        <label>Тип:</label>
                        <select id="tournamentType">
                            <option value="tournament">Турнир</option>
                            <option value="rating">Игра на рейтинг</option>
                        </select>
                    </div>
                    <button onclick="createTournament()" style="width: 100%;">Создать турнир</button>
                    
                    <div class="tournament-list" id="tournamentsList">
                        <!-- Список турниров будет здесь -->
                    </div>
                </div>
                <div id="adminLoginPrompt">
                    <p>Войдите как администратор для доступа к панели управления</p>
                </div>
            </div>
        </div>
    </div>

    <div id="statusMessage" class="status-message"></div>

    <script>
        // Конфигурация Supabase
        const SUPABASE_URL = 'https://bqycjfcjtdawyrysgrbw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxeWNqZmNqdGRhd3lyeXNncmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY2MDE5NzAsImV4cCI6MjA4MjE3Nzk3MH0.LEOUMFAd1cz_1e4uawJcaZLPCMqAQHEWM52Oy7fDjsE';

        // Инициализация Supabase
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let selectedDates = new Set();
        let allPlayers = {};
        let tournaments = {};

        // Функция показа сообщения
        function showMessage(message, type = 'success') {
            const msg = document.getElementById('statusMessage');
            msg.textContent = message;
            msg.className = `status-message ${type} show`;
            setTimeout(() => {
                msg.className = 'status-message';
            }, 3000);
        }

        // Функции авторизации
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showMessage('Введите логин и пароль', 'error');
                return;
            }

            const { data: user, error } = await supabase
                .from('pingpong_users')
                .select('*')
                .eq('username', username)
                .single();

            if (error || !user) {
                showMessage('Пользователь не найден', 'error');
                return;
            }

            // В реальном приложении используйте bcrypt для проверки пароля
            // Для демо используем простую проверку
            if (password === '13311331' && username === 'Admin') {
                // Админ пароль
                setCurrentUser(user);
            } else if (password.length >= 4) {
                // Простая проверка для демо (в продакшене используйте хеширование)
                setCurrentUser(user);
            } else {
                showMessage('Неверный пароль', 'error');
            }
        }

        async function register() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showMessage('Введите логин и пароль', 'error');
                return;
            }

            if (password.length < 4) {
                showMessage('Пароль должен быть минимум 4 символа', 'error');
                return;
            }

            // В реальном приложении хешируйте пароль!
            const { data, error } = await supabase
                .from('pingpong_users')
                .insert([{
                    username: username,
                    password_hash: password // В продакшене используйте bcrypt
                }])
                .select()
                .single();

            if (error) {
                showMessage('Ошибка регистрации: ' + error.message, 'error');
                return;
            }

            showMessage('Регистрация успешна!');
            setCurrentUser(data);
        }

        function logout() {
            currentUser = null;
            selectedDates.clear();
            updateUI();
            showMessage('Вы вышли из системы');
        }

        function setCurrentUser(user) {
            currentUser = user;
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            updateUI();
            loadData();
            showMessage(`Добро пожаловать, ${user.username}!`);
        }

        // Загрузка данных
        async function loadData() {
            if (currentUser) {
                await loadPlayerDates();
                await loadTournaments();
                updateCalendar();
            }
        }

        async function loadPlayerDates() {
            const { data, error } = await supabase
                .from('pingpong_user_dates')
                .select(`
                    date,
                    user:pingpong_users(username)
                `);

            if (!error) {
                allPlayers = {};
                data.forEach(item => {
                    const dateStr = item.date;
                    if (!allPlayers[dateStr]) {
                        allPlayers[dateStr] = [];
                    }
                    allPlayers[dateStr].push(item.user.username);
                });
                
                // Загружаем даты текущего пользователя
                if (currentUser) {
                    const { data: userDates } = await supabase
                        .from('pingpong_user_dates')
                        .select('date')
                        .eq('user_id', currentUser.id);
                    
                    if (userDates) {
                        selectedDates = new Set(userDates.map(d => d.date));
                    }
                }
            }
        }

        async function loadTournaments() {
            const { data, error } = await supabase
                .from('pingpong_tournaments')
                .select('*')
                .order('date', { ascending: true });

            if (!error) {
                tournaments = {};
                data.forEach(tournament => {
                    tournaments[tournament.date] = tournament;
                });
                updateTournamentsList();
            }
        }

        // Работа с календарем
        let calendar;

        function initCalendar() {
            calendar = flatpickr("#calendar", {
                inline: true,
                mode: "multiple",
                dateFormat: "Y-m-d",
                locale: "ru",
                minDate: "today",
                maxDate: new Date().fp_incr(365),
                onChange: function(selectedDates) {
                    if (!currentUser) {
                        showMessage('Войдите для выбора дат', 'error');
                        return;
                    }
                    
                    const newSelected = new Set(selectedDates.map(d => d.toISOString().split('T')[0]));
                    const added = [...newSelected].filter(d => !selectedDates.has(d));
                    const removed = [...selectedDates].filter(d => !newSelected.has(d));
                    
                    selectedDates = newSelected;
                    
                    added.forEach(date => selectDate(date));
                    removed.forEach(date => deselectDate(date));
                    
                    updateCalendar();
                }
            });

            updateCalendar();
        }

        async function selectDate(date) {
            const { error } = await supabase
                .from('pingpong_user_dates')
                .insert([{
                    user_id: currentUser.id,
                    date: date
                }]);

            if (error) {
                showMessage('Ошибка при выборе даты: ' + error.message, 'error');
                return;
            }

            // Проверяем, нужно ли создать турнир
            const playersOnDate = allPlayers[date] || [];
            if (playersOnDate.length + 1 >= 3) {
                // Проверяем, есть ли уже турнир
                if (!tournaments[date]) {
                    // Автоматическое создание турнира
                    await createAutoTournament(date);
                }
            }
            await loadPlayerDates();
            updateCalendar();
        }

        async function deselectDate(date) {
            const { error } = await supabase
                .from('pingpong_user_dates')
                .delete()
                .eq('user_id', currentUser.id)
                .eq('date', date);

            if (!error) {
                await loadPlayerDates();
                updateCalendar();
            }
        }

        async function createAutoTournament(date) {
            if (tournaments[date]) return;

            const { data, error } = await supabase
                .from('pingpong_tournaments')
                .insert([{
                    date: date,
                    name: `Авто-турнир ${date}`,
                    type: 'tournament',
                    created_by: currentUser.id
                }])
                .select()
                .single();

            if (!error) {
                tournaments[date] = data;
                showMessage(`Турнир автоматически создан на ${date}!`);
                updateTournamentsList();
            }
        }

        function updateCalendar() {
            setTimeout(() => {
                const today = new Date().toISOString().split('T')[0];
                
                document.querySelectorAll('.flatpickr-day').forEach(day => {
                    if (!day.dateObj) return;
                    
                    const date = day.dateObj.toISOString().split('T')[0];
                    day.classList.remove('selected', 'tournament-day', 'day-with-players');
                    
                    // Убираем выбор с прошедших дат
                    if (date < today) {
                        day.classList.add('disabled');
                        return;
                    }
                    
                    // Проверяем выбор пользователя
                    if (selectedDates.has(date)) {
                        day.classList.add('selected');
                    }
                    
                    // Проверяем турниры
                    if (tournaments[date]) {
                        day.classList.add('tournament-day');
                        day.title = tournaments[date].name;
                    }
                    
                    // Показываем количество игроков
                    const players = allPlayers[date];
                    if (players && players.length > 0) {
                        day.classList.add('day-with-players');
                        
                        let countElem = day.querySelector('.player-count');
                        if (!countElem) {
                            countElem = document.createElement('span');
                            countElem.className = 'player-count';
                            day.appendChild(countElem);
                        }
                        countElem.textContent = players.length;
                    }
                });
            }, 100);
        }

        // Админ функции
        async function createTournament() {
            if (!currentUser || !currentUser.is_admin) {
                showMessage('Требуются права администратора', 'error');
                return;
            }

            const date = document.getElementById('tournamentDate').value;
            const name = document.getElementById('tournamentName').value;
            const type = document.getElementById('tournamentType').value;

            if (!date || !name) {
                showMessage('Заполните все поля', 'error');
                return;
            }

            const { data, error } = await supabase
                .from('pingpong_tournaments')
                .insert([{
                    date: date,
                    name: name,
                    type: type,
                    created_by: currentUser.id
                }])
                .select()
                .single();

            if (error) {
                showMessage('Ошибка: ' + error.message, 'error');
                return;
            }

            tournaments[date] = data;
            updateCalendar();
            updateTournamentsList();
            
            document.getElementById('tournamentDate').value = '';
            document.getElementById('tournamentName').value = '';
            
            showMessage('Турнир создан!');
        }

        async function editTournament(id) {
            const newName = prompt('Введите новое название турнира:');
            if (!newName) return;

            const { error } = await supabase
                .from('pingpong_tournaments')
                .update({ name: newName })
                .eq('id', id);

            if (!error) {
                await loadTournaments();
                updateCalendar();
                showMessage('Турнир обновлен');
            }
        }

        async function deleteTournament(id, date) {
            if (!confirm('Удалить турнир?')) return;

            const { error } = await supabase
                .from('pingpong_tournaments')
                .delete()
                .eq('id', id);

            if (!error) {
                delete tournaments[date];
                updateCalendar();
                updateTournamentsList();
                showMessage('Турнир удален');
            }
        }

        function updateTournamentsList() {
            const list = document.getElementById('tournamentsList');
            if (!list) return;

            const sortedTournaments = Object.values(tournaments)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            list.innerHTML = sortedTournaments.map(t => `
                <div class="tournament-item">
                    <div class="tournament-info">
                        <h4>${t.name}</h4>
                        <p>${t.date} (${t.type === 'tournament' ? 'Турнир' : 'Рейтинг'})</p>
                        <small>Участников: ${allPlayers[t.date] ? allPlayers[t.date].length : 0}</small>
                    </div>
                    ${currentUser && currentUser.is_admin ? `
                        <div class="tournament-actions">
                            <button onclick="editTournament('${t.id}')" style="background:#ffd43b;color:#333;">Ред.</button>
                            <button onclick="deleteTournament('${t.id}', '${t.date}')" style="background:#fa5252;color:white;">Удалить</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Обновление UI
        function updateUI() {
            const loginForm = document.getElementById('loginForm');
            const userInfo = document.getElementById('userInfo');
            const adminContent = document.getElementById('adminContent');
            const adminLoginPrompt = document.getElementById('adminLoginPrompt');

            if (currentUser) {
                loginForm.style.display = 'none';
                userInfo.style.display = 'flex';
                document.getElementById('currentUser').textContent = currentUser.username;
                
                if (currentUser.is_admin) {
                    adminContent.classList.add('show');
                    adminLoginPrompt.style.display = 'none';
                } else {
                    adminContent.classList.remove('show');
                    adminLoginPrompt.style.display = 'block';
                    adminLoginPrompt.innerHTML = '<p>Доступно только администраторам</p>';
                }
            } else {
                loginForm.style.display = 'flex';
                userInfo.style.display = 'none';
                adminContent.classList.remove('show');
                adminLoginPrompt.style.display = 'block';
                adminLoginPrompt.innerHTML = '<p>Войдите как администратор для доступа к панели управления</p>';
            }

            updateCalendar();
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            initCalendar();
            updateUI();
            
            // Загружаем данные если есть сохраненный пользователь
            const savedUser = localStorage.getItem('pingpong_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                updateUI();
                loadData();
            }
        });
    </script>
</body>
</html>
